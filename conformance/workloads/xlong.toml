# What CI runs: long plus the vendor suites, the rocThrust-semantic cases and the heavy Level Zero CTS families.
extends = "long"
exclude_programs = ["opencl_cts_thread_dimensions", "sycl_cts_full_conformance_*"]
exclude_cases = []
add_levelzero_cases = [
  "InterdependCMDListsPairSameEngineTypeParameterization/zeTestMixedCMDListsInterdependPairSameEngineType.*",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularAndImmCMDListsOnComputeEngineThenCorrectResultsAreReturned/*",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularAndImmCMDListsOnCopyEngineThenCorrectResultsAreReturned/*",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularCMDListOnCopyEngineAndImmCMDListOnComputeEngineThenCorrectResultsAreReturned/*",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularCMDListOnComputeEngineAndImmCMDListOnCopyEngineThenCorrectResultsAreReturned/compute_cmd_queue_flag_1_copy_cmd_queue_flag_1_cmd_list_flag_1_not_using_event",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularCMDListOnComputeEngineAndImmCMDListOnCopyEngineThenCorrectResultsAreReturned/compute_cmd_queue_flag_0_copy_cmd_queue_flag_1_cmd_list_flag_2_using_event",
  "InterdependCMDListsPipeliningParameterization/zeTestMixedCMDListsInterdependPipelining.GivenRegularCMDListOnComputeEngineAndImmCMDListOnCopyEngineThenCorrectResultsAreReturned/compute_cmd_queue_flag_1_copy_cmd_queue_flag_0_cmd_list_flag_3_not_using_event",
  "TimestampsTest.*",
]
