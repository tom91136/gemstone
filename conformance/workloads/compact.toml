# Compact matrix registrations retain the smaller size/type sets.
# Vector step and array alignment are bounded; struct cases expand a large type/layout matrix.
# Integer operator sweeps (including quick variants) and half stores exhaust large input domains.
# Full-conformance range_api submits trillions of work-items; defer that one case.
# Defer upstream image-dimension sweeps without changing their tested sizes.
specs = ['~"cts/opencl/basic/imagedim_*"~"range_api"~[full-matrix]~[regression]~"cts/opencl/vectors/vec_align_struct*"~"cts/opencl/vectors/vec_align_packed_struct*"~"cts/opencl/integer_ops/quick_*"~"cts/opencl/integer_ops/char_*"~"cts/opencl/integer_ops/uchar_*"~"cts/opencl/integer_ops/short_*"~"cts/opencl/integer_ops/ushort_*"~"cts/opencl/integer_ops/int_*"~"cts/opencl/integer_ops/uint_*"~"cts/opencl/integer_ops/long_*"~"cts/opencl/integer_ops/ulong_*"~"cts/opencl/half/vstore*"']
