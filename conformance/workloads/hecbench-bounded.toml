# Short CI selection: small defaults and no input files. Each case must finish within half the 600 s case limit
# (300 s) when measured on a loaded machine, so CI has headroom.
# mdh is not here: its shipped inputs overflow expf, so its PASS checks nothing, and -itmax 1 exceeds the case limit
# under emulation.
# assert is not here: its expected output contains "failed", which classifies as a failure on any device, and its
# performance kernel exceeds the instruction budget under emulation.
specs = ['*']
include_programs = [
  'hecbench_abacus', 'hecbench_bitpacking', 'hecbench_fsm', 'hecbench_laplace', 'hecbench_minimod', 'hecbench_overlap',
  'hecbench_sdma', 'hecbench_streamcluster'
]

# minimod: the Makefile run target (grid 256, 1000 steps) exceeds the 300 s budget; run its default case.
[program_arguments]
hecbench_minimod = []

# abacus: the Makefile run target (argument 100) exceeds the 300 s budget; this reduced case takes seconds.
hecbench_abacus = ['4', '1', '4', '0.04', '1']
# fsm: a 1024-entry trace; the staged source also lowers the compile-time repeat count to 1.
hecbench_fsm = ['1024']
# sdma: one repeat of each size in the sweep up to 1 GiB; the Makefile run target uses 100.
hecbench_sdma = ['1']
# streamcluster: 4096 points in one chunk; the Makefile run target uses 65536. The case has no pass or fail marker.
hecbench_streamcluster = ['10', '20', '256', '4096', '4096', '1000', 'none', 'output.txt', '1']
