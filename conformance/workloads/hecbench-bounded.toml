# Short CI selection: small defaults and no input files.
# mdh is not here: its shipped inputs overflow expf, so its PASS checks nothing, and -itmax 1 exceeds the case limit
# under emulation.
specs = ['*']
include_programs = ['hecbench_assert', 'hecbench_bitpacking', 'hecbench_laplace', 'hecbench_minimod', 'hecbench_overlap']
