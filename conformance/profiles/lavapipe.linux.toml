# Headless reference target for the Vulkan mustpass workloads.
# Select the implementation and API version in the external launcher's environment.
[[targets]]
name = "lavapipe-vulkan"
backend = "vulkan"
device = "*llvmpipe*"
environment = { VK_LOADER_DRIVERS_SELECT = "*lvp*", CONFORMANCE_VULKAN_CTS_TIMEOUT_SECONDS = "7200" }
