# Polyregion's Linux software OpenCL emulators. GPUOcelot only accepts the
# sm_35 code generated by CUDA 11.x and cannot consume this suite's CUDA 13 /
# C++20 artifact, so it is intentionally not advertised as a runnable target.
[[targets]]
name = "rusticl-opencl"
backend = "opencl"
device = "*llvmpipe*"
environment = { OCL_ICD_VENDORS = "/etc/OpenCL/vendors/rusticl.icd", OCL_ICD_FILENAMES = "/usr/lib64/libRusticlOpenCL.so.1", RUSTICL_ENABLE = "llvmpipe", CONFORMANCE_OPENCL_CTS_WIMPY = "1", CONFORMANCE_OPENCL_CTS_ATOMIC_ITERATIONS = "16", CONFORMANCE_OPENCL_CTS_ATOMIC_THREADS = "128", CONFORMANCE_OPENCL_CTS_TIMEOUT = "600" }

[[targets]]
name = "portable-opencl"
backend = "opencl"
device = "*Portable*"
environment = { OCL_ICD_VENDORS = "/etc/OpenCL/vendors/pocl.icd", OCL_ICD_FILENAMES = "/usr/lib64/libpocl.so.2", CONFORMANCE_OPENCL_CTS_WIMPY = "1", CONFORMANCE_OPENCL_CTS_ATOMIC_ITERATIONS = "16", CONFORMANCE_OPENCL_CTS_ATOMIC_THREADS = "128", CONFORMANCE_OPENCL_CTS_TIMEOUT = "600" }
# PoCL 7.1 implementation defects reproduced independently by the pinned OpenCL CTS.
skips = [
  "cts/opencl/api/consistency_il_programs",
  "cts/opencl/api/negative_create_context",
  "cts/opencl/api/negative_create_context_from_type",
  "cts/opencl/api/negative_get_device_ids",
  "cts/opencl/api/negative_invalid_arg_sampler",
  "cts/opencl/api/negative_set_read_write_image_arg",
  "cts/opencl/api/null_required_work_group_size",
  "cts/opencl/basic/async_copy_global_to_local",
  "cts/opencl/basic/async_copy_local_to_global",
  "cts/opencl/basic/async_strided_copy_global_to_local",
  "cts/opencl/basic/async_strided_copy_local_to_global",
  "cts/opencl/basic/vstore_local",
  # Segfaults in clBuildProgram while sizing the kernel-scope local atomic.
  "edge-cases/runtime/opencl/generic-address-space/pointers/n128-l32",
]

[[targets]]
name = "lavapipe-vulkan"
backend = "vulkan"
device = "*llvmpipe*"
# Device-group CTS cases interpret the device index within the selected group.
# Isolate lavapipe so its global and group-local indices both identify it.
environment = { VK_LOADER_DRIVERS_SELECT = "*lvp*" }
