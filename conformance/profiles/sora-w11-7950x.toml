# Ryzen 9 7950X iGPU (gfx1036) and RTX 4090 (sm_89).
[[targets]]
name = "cuda-ptx"
backend = "cuda"
architecture = "sm_89"
device = "*RTX 4090*"
environment = { CONFORMANCE_CUDA_CODE = "ptx", GEMSTONE_CUDA_CODE = "ptx", CUDA_FORCE_PTX_JIT = "1", CUDA_DISABLE_PTX_JIT = "0" }
routeSkips = ["blas/*", "edge/blas/*"]
skipReason = "pinned CUDA 13.3 cuBLAS PTX entries target sm_120 and cannot run in strict PTX mode on sm_89"

[[targets]]
name = "cuda-sass"
backend = "cuda"
architecture = "sm_89"
device = "*RTX 4090*"
environment = { CONFORMANCE_CUDA_CODE = "sass", GEMSTONE_CUDA_CODE = "sass", CUDA_FORCE_PTX_JIT = "0", CUDA_DISABLE_PTX_JIT = "1" }

[[targets]]
name = "amd-hip"
backend = "hip"
architecture = "gfx1036"
device = "*gfx1036*"
