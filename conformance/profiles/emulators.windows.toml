# Polyregion's Windows software OpenCL emulator. GPUOcelot only accepts the
# sm_35 code generated by CUDA 11.x and cannot consume this suite's CUDA 13 /
# C++20 artifact, so it is intentionally not advertised as a runnable target.
[[targets]]
name = "portable-opencl"
backend = "opencl"
device = "*Portable*"
environment = { CONFORMANCE_OPENCL_CTS_WIMPY = "1", CONFORMANCE_OPENCL_CTS_TIMEOUT = "600" }
