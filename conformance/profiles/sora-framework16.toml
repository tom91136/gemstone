# Ryzen AI 9 HX 370, Radeon 890M (gfx1150), and the CUDA target from Polyregion.
[[targets]]
name = "cuda-ptx"
backend = "cuda"
architecture = "sm_120"
device = "*sm_120*"
environment = { CONFORMANCE_CUDA_CODE_MODE = "ptx" }

[[targets]]
name = "cuda-sass"
backend = "cuda"
architecture = "sm_120"
device = "*sm_120*"
environment = { CONFORMANCE_CUDA_CODE_MODE = "sass" }

[[targets]]
name = "amd-hsa"
backend = "hsa"
architecture = "gfx1150"
device = "*gfx1150*"

[[targets]]
name = "amd-hip"
backend = "hip"
architecture = "gfx1150"
device = "*gfx1150*"

[[targets]]
name = "amd-opencl"
backend = "opencl"
device = "*AMD*"
