version = "3.11.5"
runner.dialect = scala3

style = defaultWithAlign

maxColumn = 120

align.preset = more

rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  AsciiSortImports
  PreferCurlyFors
  ExpandImportSelectors
]

project.excludePaths = [
  "glob:**/codestyle/input/**",
  "glob:**/codestyle/output/**"
]

fileOverride {
  "glob:**/src/generated/**" {
    align.preset = none
    rewrite.rules = []
  }
}

newlines.source = keep

rewrite.neverInfix.excludeFilters = [until
  to
  by
  eq
  ne
  "should.*"
  "contain.*"
  "must.*"
  in
  be
  taggedAs
  thrownBy
  synchronized
  have
  when
  size
  theSameElementsAs]
