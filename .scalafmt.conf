version = "3.9.8"
runner.dialect = scala3

style = defaultWithAlign

maxColumn = 120

project.excludeFilters = [
  ".*[/\\\\]generated[/\\\\].*"
  ".*[/\\\\]opencl[/\\\\]OpenCL\\.scala"
  ".*[/\\\\]levelzero[/\\\\]LevelZero\\.scala"
]

align.preset = more

rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  AsciiSortImports
  PreferCurlyFors
]

newlines.source = keep

rewrite.neverInfix.excludeFilters = [until
  to
  by
  eq
  ne
  "should.*"
  "contain.*"
  "must.*"
  in
  be
  taggedAs
  thrownBy
  synchronized
  have
  when
  size
  theSameElementsAs]
