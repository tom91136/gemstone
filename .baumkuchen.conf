# Packages are imported whole, so a type keeps its package prefix to stay distinct from same-named types elsewhere.
disabled = [PackageNaming]
generated = ["**/generated/**"]
hot = [
  "net.kurobako.gemstone.isa.**.VM*"
  "net.kurobako.gemstone.isa.**.*Semantics"
  "net.kurobako.gemstone.isa.**.NvidiaStaged"
  "net.kurobako.gemstone.isa.**.SPIRVStaged"
  "net.kurobako.gemstone.isa.**.LaneLoop"
  "net.kurobako.gemstone.isa.**.LaneFaults"
  "net.kurobako.gemstone.semantics.Execute"
  "net.kurobako.gemstone.semantics.Algebra"
  "net.kurobako.gemstone.semantics.prelude.Float16"
  "net.kurobako.gemstone.semantics.prelude.Float32"
  "net.kurobako.gemstone.semantics.prelude.Float64"
  "net.kurobako.gemstone.isa.amdgpu.Floats"
  "net.kurobako.gemstone.isa.amdgpu.MatrixArithmetic"
  "net.kurobako.gemstone.isa.amdgpu.Minifloats"
  "net.kurobako.gemstone.isa.amdgpu.BufferResource"
  "net.kurobako.gemstone.isa.amdgpu.ImageResource"
  "net.kurobako.gemstone.isa.amdgpu.TexelFormat"
  "net.kurobako.gemstone.isa.spirv.*Machine"
  "net.kurobako.gemstone.isa.spirv.Sampling"
  "net.kurobako.gemstone.isa.spirv.graphics.GraphicsAccess"
  "net.kurobako.gemstone.vm.AddressSpace"
  "net.kurobako.gemstone.vm.ObservedAddressSpace"
  "net.kurobako.gemstone.binary.*"
  "!**.*Suite"
  # the compilers lower a program once, before any of it runs
  "!net.kurobako.gemstone.isa.**.VM*Compiler"
]
reflective = [
  "net.kurobako.gemstone.isa.nvidia.Warp"
  "net.kurobako.gemstone.isa.nvidia.Launch"
  "net.kurobako.gemstone.isa.nvidia.Constants"
  "net.kurobako.gemstone.isa.nvidia.Memory"
  "net.kurobako.gemstone.isa.amdgpu.Wave"
  "net.kurobako.gemstone.isa.amdgpu.Control"
  "net.kurobako.gemstone.isa.amdgpu.Memory"
  "net.kurobako.gemstone.isa.amdgpu.Images"
  "net.kurobako.gemstone.isa.amdgpu.FlatMemory"
  "net.kurobako.gemstone.isa.amdgpu.GlobalMemory"
  "net.kurobako.gemstone.isa.amdgpu.LocalMemory"
  "net.kurobako.gemstone.isa.amdgpu.PrivateMemory"
  "net.kurobako.gemstone.isa.check.Lookup"
  "net.kurobako.gemstone.**.Resource_*"
]
bounded = [
  {
    member = "net.kurobako.gemstone.isa.nvidia.VMInterpreter.Execution.warpArrivals"
    max = 32
    reason = "one slot per warp of a workgroup; workgroups are limited to 1024 lanes (VMInterpreter launch check)"
  }
  {
    member = "net.kurobako.gemstone.graphics.GraphicsProtocol.GraphicsVertexFormat.widths"
    max = 4
    reason = "VertexStage.decode rejects a format with more than four widths (require lane < 4)"
  }
  {
    member = "net.kurobako.gemstone.isa.ptx.Metadata.Entry.modifierTargets"
    max = 26
    reason = "generated from the PTX ISA tables; PTXMetadataBoundsSuite keeps it true"
  }
  {
    member = "net.kurobako.gemstone.isa.ptx.Validation.validateForms.forms"
    max = 37
    reason = "generated from the PTX ISA tables; PTXMetadataBoundsSuite keeps it true"
  }
  {
    member = "net.kurobako.gemstone.isa.nvidia.TensorMemoryRender.Choice.select.varying"
    max = 5
    reason = "indices of TensorMemory.Fields.formats: A, B, scale or accumulator, saturate, sparse"
  }
  {
    member = "net.kurobako.gemstone.isa.amdgpu.VMState.WorkgroupBarriers.arrived"
    max = 2
    reason = "the two implicit GFX12 workgroup barriers (ids -1 and -2)"
  }
  {
    member = "net.kurobako.gemstone.codegen.AMDGPUOperandDomains.merge.overrides"
    max = 24
    reason = "the hand-written AMDGPUDomainRules.Overrides rows; OperandDomainSuite keeps it true"
  }
]

text {
  terms = [
    {
      words = [contract, plan]
      files = [
        "**.{c,cc,cpp,cxx,cu,h,hh,hip,hpp,hxx,inc,inl,cmake,conf,java,json,kt,md,py,sbt,scala,sh,toml,txt,yaml,yml}"
        "**/{.clang-format,.scalafix.conf,.scalafmt.conf,CMakeLists.txt}"
      ]
      exclude = [
        "**/generated/**", "**/licences/**", "**/third_party/**", "**/vendor/**"
        "/build.sbt", "/.baumkuchen.conf", "**/LICEN[CS]E*", "/plans/**"
      ]
    }
  ]
  patterns = [
    {
      pattern = "\\bU?INT(?:8|16|32|64|MAX|PTR)_C\\b"
      message = "forbidden integer constant macro; write uint64_t{n}"
      files = ["/{native,conformance,server/src/main/resources/scala-native}/**.{cc,cpp,cu,cxx,hip,h,hh,hpp,hxx,cuh,inc,inl}"]
      exclude = ["**/generated/**", "**/licences/**", "**/third_party/**", "**/vendor/**"]
    }
  ]
  binary = {}
  preceded = [
    {
      pattern = "^[A-Z_]*TEST_CASE[A-Z_]*\\s*\\("
      message = "Catch test cases must be preceded by a blank line"
      files = ["/{native,conformance,server/src/main/resources/scala-native}/**.{c,cc,cpp,cu,cxx,hip,h,hh,hpp,hxx,cuh,inc,inl}"]
      exclude = ["**/generated/**", "**/licences/**", "**/third_party/**", "**/vendor/**"]
    }
  ]
  followed = [
    {
      pattern = "^\\s*#\\s*include\\b"
      continues = "^\\s*#\\s*(include|else|elif)\\b"
      neutral = "^\\s*#"
      message = "include blocks must be followed by a blank line"
      files = ["/{native,conformance,server/src/main/resources/scala-native}/**.{c,cc,cpp,cu,cxx,hip,h,hh,hpp,hxx,cuh,inc,inl}"]
      exclude = ["**/generated/**", "**/licences/**", "**/third_party/**", "**/vendor/**"]
    }
  ]
}
