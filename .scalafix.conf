rules = [
  DisableSyntax
  GemstoneExplicitEtaExpansion
  GemstoneFilenameConventions
  GemstoneForbiddenAPIs
  GemstoneIronImports
  GemstoneNoAssume
  GemstoneNoExplicitNew
  GemstoneNoIntrinsicLocks
  RedundantSyntax
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
lint.error = true
