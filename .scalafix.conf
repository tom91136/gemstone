rules = [
  DisableSyntax
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
lint.error = true

PackageBoundary.boundaries = [
  {
    sources = "(^|/)isa/(ptx|sass)(-asm|-vm)?/src/"
    exempt = "/asm/|/src/(generated/)?test/"
    forbidden = ["net/kurobako/gemstone/isa/ptx/asm/", "net/kurobako/gemstone/isa/sass/asm/"]
    message = "PTX and SASS runtime sources must not reference their asm packages, so the runtimes load without them"
  }
]
ForbiddenAPIs.symbols = {
  "java/lang/System#" = "use Scala APIs or a narrow platform abstraction instead of java.lang.System"
  "java/lang/Runtime#" = "use scala.sys.runtime instead of java.lang.Runtime"
  "java/util/ArrayDeque#" = "use scala.collection.mutable.ArrayDeque instead of java.util.ArrayDeque"
  "java/nio/file/Files#setPosixFilePermissions(" = "use portable file handling and conditionally apply attributes supported by the file store"
  "java/lang/String#toUpperCase(" = "import net.kurobako.gemstone.string.* and use toUpperCaseRoot"
  "java/lang/String#toLowerCase(" = "import net.kurobako.gemstone.string.* and use toLowerCaseRoot"
  "java/lang/reflect/" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/invoke/MethodHandle" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/invoke/MethodType" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/invoke/CallSite" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/invoke/LambdaMetafactory" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#forName(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#newInstance(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getMethod" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getDeclared" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getField" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getConstructor" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getEnumConstants(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getRecordComponents(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getAnnotation" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#isAnnotationPresent(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getClassLoader(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Class#getProtectionDomain(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/ClassLoader#" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/lang/Thread#getContextClassLoader(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "java/util/ServiceLoader#" = "Java reflection is banned: use statically typed code or an explicit registry"
  "scala/reflect/ClassTag#runtimeClass(" = "Java reflection is banned: use statically typed code or an explicit registry"
  "sun/misc/Unsafe#" = "Java reflection is banned: use statically typed code or an explicit registry"
}
NamespaceImports.packages = ["net.kurobako.gemstone"]
NoPackagePrivate.tiers = ["net.kurobako.gemstone", "net.kurobako.gemstone.isa"]
ConfiguredIdioms.idioms = [
  {
    pattern = "(IEEE754.floatToBinary32($x).toLong >>> 23) & 0xff"
    helper = "net.kurobako.gemstone.isa.amdgpu.Minifloats.exponent"
  }
  {
    pattern = "$o ^ ((($o >>> 7) & $m) << 4)"
    helper = "net.kurobako.gemstone.isa.nvidia.MatrixDescriptor.swizzled"
  }
  {
    pattern = "($s * 0x9e3779b97f4a7c15L + $c) * 0xbf58476d1ce4e5b9L"
    helper = "net.kurobako.gemstone.isa.check.SeededMemory.byte"
  }
]
