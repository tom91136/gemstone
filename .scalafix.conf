rules = [
  DisableSyntax
  GemstoneExplicitEtaExpansion
  GemstoneSafeStringCase
  GemstoneNamespaceImports
  GemstoneNoPackagePrivate
  GemstoneNoFinalClass
  GemstoneCompanionOrder
  GemstoneFinalValPascalCase
  GemstoneFilenameConventions
  GemstoneForbiddenAPIs
  GemstoneNoExplicitNew
  GemstoneNoIntrinsicLocks
  GemstoneNoIterator
  GemstoneNoThen
  GemstoneNoTypeCasting
  GemstoneSimplifyMatch
  GemstoneRedundantCollectionConversion
  GemstoneRedundantCaseClassVal
  GemstoneCollectionIdioms
  GemstoneCollectionNonEmpty
  GemstoneInterpolationBraces
  GemstoneRequireTailRec
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
lint.error = true
