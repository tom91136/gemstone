rules = [
  DisableSyntax
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
lint.error = true

PackageBoundary.boundaries = [
  {
    sources = "(^|/)isa/(ptx|sass)(-asm|-vm)?/src/"
    exempt = "/asm/|/src/(generated/)?test/"
    forbidden = ["net/kurobako/gemstone/isa/ptx/asm/", "net/kurobako/gemstone/isa/sass/asm/"]
    message = "PTX and SASS runtime sources must not reference their asm packages, so the runtimes load without them"
  }
]
ForbiddenAPIs.symbols = {
  "java/lang/System#" = "use Scala APIs or a narrow platform abstraction instead of java.lang.System"
  "java/lang/Runtime#" = "use scala.sys.runtime instead of java.lang.Runtime"
  "java/util/ArrayDeque#" = "use scala.collection.mutable.ArrayDeque instead of java.util.ArrayDeque"
  "java/nio/file/Files#setPosixFilePermissions(" = "use portable file handling and conditionally apply attributes supported by the file store"
  "java/lang/String#toUpperCase(" = "import net.kurobako.gemstone.string.* and use toUpperCaseRoot"
  "java/lang/String#toLowerCase(" = "import net.kurobako.gemstone.string.* and use toLowerCaseRoot"
}
NamespaceImports.packages = ["net.kurobako.gemstone"]
NoPackagePrivate.tiers = ["net.kurobako.gemstone", "net.kurobako.gemstone.isa"]
