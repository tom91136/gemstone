rules = [
  DisableSyntax
  AsmBoundary
  BannedSyntax
  CollectionIdioms
  CompanionOrder
  ExplicitEtaExpansion
  FilenameConventions
  FinalValPascalCase
  ForbiddenAPIs
  NamespaceImports
  NoBoxedPrimitives
  NoPackagePrivate
  RedundantCaseClassVal
  RequireTailRec
  SimplifyMatch
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
lint.error = true
