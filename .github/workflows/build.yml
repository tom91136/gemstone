# act (artefact steps are skipped, nektos/act#6022; target/ci stands in for them): `mkdir -p .cache target/{ci,native,conformance}`,
# a="-P ubuntu-24.04=catthehacker/ubuntu:act-24.04 --pull=false --rm", v="--security-opt label=disable -v $PWD/target/ci:$PWD/target/ci".
# Podman rejects act's copies through the image's absolute /var/run symlink; there, use an image built with
# `printf 'FROM catthehacker/ubuntu:act-24.04\nRUN rm /var/run && ln -s ../run /var/run\n' | podman build -t act-24.04-podman -`.
# build's and conformance-build's sibling containers bind by host path, so move the host's target/native and
# target/conformance aside first; other jobs need only shards, which their matrices come from, as act would otherwise
# follow `needs` back to build. conformance-package also takes the package-cache job for its key:
#   act -j build $a --container-options "$v -v $PWD/.cache:$PWD/.cache -v $PWD/target/native:$PWD/target/native -v $PWD/target/conformance:$PWD/target/conformance"
#   act -j conformance-build --matrix shard:sycl-0 $a --container-options "$v -v $PWD/.cache:$PWD/.cache -v $PWD/target/conformance:$PWD/target/conformance"
#   sed 's/^    needs:.*/    needs: [shards, conformance-package-cache]/' .github/workflows/build.yml > /tmp/ci.yml && act -W /tmp/ci.yml -j conformance-package $a --container-options "$v -v $PWD/target/conformance:$PWD/target/conformance"
#   sed 's/^    needs:.*/    needs: shards/' .github/workflows/build.yml > /tmp/ci.yml && act -W /tmp/ci.yml -j <job> $a --container-options "$v:ro -v $PWD/target/conformance:$PWD/target/conformance"
name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: Conformance run tier
        type: choice
        options: [short, long, xlong, all]
        default: xlong
permissions:
  contents: read
env:
  GEMSTONE_CONTAINER_EXE: docker
  CONFORMANCE_BUILD_PROFILE: complete
  CONFORMANCE_WORKLOAD: ${{ inputs.tier || 'xlong' }}
  # a runner that runs out of memory is shut down without a trace, so long steps sample it into the log as they run
  MEMORY_SAMPLE: >-
    echo "::group::memory $(date -u +%T)"; free -m; cat /proc/pressure/memory 2>/dev/null;
    ps -eo rss=,args= --sort=-rss | head -5 | cut -c1-200; echo "::endgroup::"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - &free-disk
        name: Free disk space
        if: ${{ !env.ACT }}
        run: |
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            echo "removing $path"
            sudo rm -rf "$path"
          done
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # sbt does not run on an llvm-offload cache hit, which leaves no sbt cache paths to save
          cache: ${{ steps.offload-cache.outputs.cache-hit != 'true' && 'sbt' || '' }}
      - &sbt
        uses: sbt/setup-sbt@v1
      - &tools-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/tools
          key: tools-make-4.4.1-ninja-1.13.2-${{ hashFiles('conformance/artifacts/Toolchains.cmake') }}
      - &tools
        name: Native tools
        timeout-minutes: 20
        # the conformance jobserver needs make >= 4.4 and ninja >= 1.13; LLVM is the release the conformance images pin,
        # rather than apt.llvm.org, which drops out often enough to fail runs
        run: |
          sudo conformance/apt-install build-essential \
            cmake libgc-dev liblz4-dev libzstd-dev zlib1g-dev python3 unzip xz-utils zstd
          tools=~/.local/tools
          if [ ! -x "$tools/bin/make" ] || [ ! -x "$tools/bin/ninja" ]; then
            curl -fsSL https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz | tar -xz -C "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP/make-4.4.1" && ./configure -q --prefix="$tools" && make -s -j"$(nproc)" install)
            curl -fsSL -o "$RUNNER_TEMP/ninja.zip" https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
            unzip -q -o "$RUNNER_TEMP/ninja.zip" -d "$tools/bin"
          fi
          release=$(sed -n 's/^set(conformance_clang_release \([0-9.]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          sha256=$(sed -n 's/^set(conformance_clang_release_sha256 \([0-9a-f]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          llvm="$tools/llvm-$release"
          if [ ! -x "$llvm/bin/clang" ]; then
            archive="LLVM-$release-Linux-X64"
            curl -fsSL --retry 5 --speed-limit 102400 --speed-time 60 -o "$RUNNER_TEMP/llvm.tar.xz" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$release/$archive.tar.xz"
            echo "$sha256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum --check --strict
            mkdir -p "$llvm"
            set -- "$archive/lib/clang/${release%%.*}/include"
            for tool in clang clang++ "clang-${release%%.*}" llvm-link; do
              set -- "$@" "$archive/bin/$tool"
            done
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" --strip-components=1 -C "$llvm" "$@"
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          mkdir -p "$tools/bin"
          for tool in clang clang++ llvm-link; do
            ln -sf "$llvm/bin/$tool" "$tools/bin/$tool"
          done
          echo "$tools/bin" >> "$GITHUB_PATH"
      - &toolchain-image-key
        name: Native toolchain image key
        id: toolchain-image-key
        run: echo "key=$(cmake -P conformance/artifacts/NativeToolchain.cmake | sed 's/.*://')" >> "$GITHUB_OUTPUT"
      - &toolchain-image
        name: Restore native toolchain image
        id: toolchain-image
        uses: actions/cache/restore@v6
        with:
          path: .cache/native-toolchain
          key: native-toolchain-${{ steps.toolchain-image-key.outputs.key }}
      - &toolchain-image-load
        name: Load native toolchain image
        if: ${{ steps.toolchain-image.outputs.cache-hit == 'true' }}
        run: zstd -dc --long=30 .cache/native-toolchain/image.tar.zst | docker load
      - &references
        name: Restore references
        id: references
        uses: actions/cache/restore@v6
        with:
          path: .cache/references
          key: references-${{ hashFiles('tools/codegen/**/References.scala') }}
          restore-keys: |
            references-${{ hashFiles('tools/codegen/**/References.scala') }}-
            references-
      - &dependencies
        name: Restore conformance dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: .cache/conformance
          key: conformance-dependencies-${{ hashFiles('conformance/dependencies.cmake') }}
          restore-keys: |
            conformance-dependencies-${{ hashFiles('conformance/dependencies.cmake') }}-
            conformance-dependencies-
      - name: Generated sources
        run: |
          state() { git status --porcelain --untracked-files=all; git diff | sha256sum; }
          before=$(state)
          sbt --server --batch codegen
          [ "$before" = "$(state)" ] || { git status --short; exit 1; }
      - name: Compile
        if: ${{ !cancelled() }}
        run: sbt --server --batch Test/compile explorerJS/fullLinkJS native/build conformance/conformanceHost
      - name: Export native toolchain image
        if: ${{ !cancelled() && steps.toolchain-image.outputs.cache-hit != 'true' }}
        run: |
          tag=$(cat target/native/container/toolchain-image 2>/dev/null) || exit 0
          docker image inspect "$tag" >/dev/null 2>&1 || exit 0
          mkdir -p .cache/native-toolchain
          docker save "$tag" | zstd -T0 -q -3 -f -o .cache/native-toolchain/image.tar.zst
          ls -l .cache/native-toolchain
      - name: Save native toolchain image
        if: ${{ !cancelled() && steps.toolchain-image.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/native-toolchain
          key: ${{ steps.toolchain-image.outputs.cache-primary-key }}
      - name: Download cache contents
        id: downloads
        if: always()
        # saved keys name their contents, so a cache that grew after a partial save is saved again
        run: |
          echo "references=$(find .cache/references -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save references
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/references
          key: ${{ steps.references.outputs.cache-primary-key }}-${{ steps.downloads.outputs.references }}
      - name: Pack
        if: ${{ !cancelled() }}
        run: |
          # sbt's disk cache links outputs into ~/.cache, which the unpacking jobs do not have
          pack() { tar -chf - "${@:2}" | zstd -T0 -q -12 --long=30 -f -o "target/ci/$1.tar.zst"; }
          mkdir -p target/ci
          pack build target/native/build target/native/container target/references/api-native target/references/level-zero \
            target/references/sass target/references/amdgpu/amd/xml target/conformance/host target/out/jvm
          ls -l target/ci
      - name: Upload
        if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: target/ci/build.tar.zst
          compression-level: 0

  # the build and run shards come from one policy in Shards.cmake
  shards:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.shards.outputs.build }}
      run: ${{ steps.shards.outputs.run }}
      lint: ${{ steps.shards.outputs.lint }}
    steps:
      - *checkout
      - id: shards
        run: |
          for mode in build run; do
            matrix=$(cmake "-DCONFORMANCE_BUILD_PROFILE=$CONFORMANCE_BUILD_PROFILE" "-DMODE=$mode" -P conformance/artifacts/Shards.cmake \
              2>"$RUNNER_TEMP/warnings")
            sed 's/^warning: /::warning::/' "$RUNNER_TEMP/warnings"
            echo "$mode=$matrix" | tee -a "$GITHUB_OUTPUT"
          done
          backends=$(sed -n 's/^add_lint(\([a-z]*\) .*/"\1"/p' conformance/artifacts/CMakeLists.txt | paste -sd ,)
          echo "lint=[$backends]" | tee -a "$GITHUB_OUTPUT"

  conformance-package-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      package-hit: ${{ steps.package.outputs.cache-hit }}
      package-key: ${{ steps.package.outputs.cache-primary-key }}
    steps:
      - *checkout
      - name: Restore package
        id: package
        uses: actions/cache/restore@v6
        with:
          path: target/ci/conformance.tar.zst
          key: conformance-package-${{ env.CONFORMANCE_BUILD_PROFILE }}-${{ hashFiles('conformance/**', '!conformance/**/*.md', 'tools/conformance/**', 'build.sbt', 'project/**') }}
      - name: Upload package
        if: ${{ steps.package.outputs.cache-hit == 'true' && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: target/ci/conformance.tar.zst
          compression-level: 0

  # the artifact builds do not depend on the rest of build, so they run beside it
  llvm-offload:
    needs: conformance-package-cache
    if: ${{ needs.conformance-package-cache.outputs.package-hit != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - *free-disk
      - *checkout
      - name: llvm-offload key
        id: offload
        run: echo "key=$(cmake -P conformance/artifacts/Offload.cmake)" >> "$GITHUB_OUTPUT"
      - name: Find llvm-offload
        id: offload-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/llvm-offload/${{ steps.offload.outputs.key }}
          key: llvm-offload-${{ steps.offload.outputs.key }}
          lookup-only: true
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - name: Build llvm-offload
        if: ${{ steps.offload-cache.outputs.cache-hit != 'true' }}
        run: sbt --server --batch conformance/conformanceOffload
      - name: Save llvm-offload
        if: ${{ steps.offload-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/llvm-offload/${{ steps.offload.outputs.key }}
          key: llvm-offload-${{ steps.offload.outputs.key }}

  conformance-build:
    needs: [shards, conformance-package-cache, llvm-offload]
    if: ${{ needs.conformance-package-cache.outputs.package-hit != 'true' }}
    name: conformance-build (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.build) }}
    steps:
      - *free-disk
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - *dependencies
      - name: llvm-offload key
        id: offload
        if: ${{ startsWith(matrix.shard, 'cuda-') }}
        run: echo "key=$(cmake -P conformance/artifacts/Offload.cmake)" >> "$GITHUB_OUTPUT"
      - name: Restore llvm-offload
        id: offload-cache
        if: ${{ startsWith(matrix.shard, 'cuda-') }}
        uses: actions/cache/restore@v6
        with:
          path: .cache/llvm-offload/${{ steps.offload.outputs.key }}
          key: llvm-offload-${{ steps.offload.outputs.key }}
      - name: Conformance artifacts
        if: ${{ !cancelled() }}
        env:
          CONFORMANCE_SHARD_ROUTE_LIST: ${{ matrix.routes }}
          SPLIT: ${{ matrix.split }}
        run: |
          [ -z "$SPLIT" ] || export "${SPLIT?}"
          mkdir -p target/conformance/artifacts
          while sleep 20; do eval "$MEMORY_SAMPLE"; done &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          sbt --server --batch "conformance/build $CONFORMANCE_SHARD_ROUTE_LIST"
      - name: Kernel OOM records
        if: ${{ always() && !env.ACT }}
        run: sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' || echo "no kernel OOM records"
      - name: Disk usage
        if: ${{ always() }}
        run: df -h
      # every job populates the same dependency set, so one of them saves it
      - name: Download cache contents
        id: downloads
        if: ${{ always() && strategy.job-index == 0 }}
        run: echo "conformance=$(find .cache/conformance -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save conformance dependencies
        if: ${{ always() && strategy.job-index == 0 }}
        uses: actions/cache/save@v6
        with:
          path: .cache/conformance
          key: ${{ steps.dependencies.outputs.cache-primary-key }}-${{ steps.downloads.outputs.conformance }}
      # shards share their support closures, so Shards.cmake has one shard pack each
      - name: Pack
        if: ${{ !cancelled() }}
        env:
          EXCLUDED: ${{ matrix.excluded }}
          OWNED: ${{ matrix.owned }}
        run: cmake "-DMODE=shard" "-DSHARD=${{ matrix.shard }}" "-DEXCLUDED=$EXCLUDED" "-DOWNED=$OWNED" -P conformance/artifacts/Package.cmake
      - name: Upload
        if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.shard }}
          path: target/ci/conformance-${{ matrix.shard }}.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Upload support
        if: ${{ !cancelled() && !env.ACT && matrix.owned != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.shard }}-support
          path: target/ci/conformance-${{ matrix.shard }}-support.tar.zst
          compression-level: 0
          retention-days: 1

  conformance-package:
    needs: [shards, conformance-package-cache, conformance-build]
    if: ${{ !cancelled() && needs.conformance-package-cache.outputs.package-hit != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - *free-disk
      - *checkout
      - if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: target/ci
          merge-multiple: true
      - name: Merge and pack
        run: cmake -DMODE=full -P conformance/artifacts/Package.cmake
      - name: Save package
        if: ${{ needs.conformance-build.result == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: target/ci/conformance.tar.zst
          key: ${{ needs.conformance-package-cache.outputs.package-key }}
      - name: Prune packages
        if: ${{ needs.conformance-build.result == 'success' && !env.ACT && !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.conformance-package-cache.outputs.package-key }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "conformance-package-$CONFORMANCE_BUILD_PROFILE-" \
            --limit 100 --json id,key --jq '.[] | select(.key != env.KEY) | .id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
      - name: Upload
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: target/ci/conformance.tar.zst
          compression-level: 0

  test:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [JVM, JS, Native]
    env:
      GEMSTONE_OFFLINE_ON: 1
    steps:
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - *toolchain-image-key
      - *toolchain-image
      - *toolchain-image-load
      - *references
      - *dependencies
      - &download-build
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: build
          path: target/ci
      - &unpack
        name: Unpack
        # sources older than the unpacked outputs keep CMake and Ninja from rebuilding them
        run: |
          git ls-files -z --cached --others --exclude-standard | xargs -0 touch -c -h -d "@$(git log -1 --format=%ct)"
          for archive in target/ci/*.tar.zst; do zstd -dc --long=30 "$archive" | tar -xf -; done
      - name: Bitwuzla
        run: |
          release=$(sed -n 's/^set(conformance_bitwuzla_release \([0-9.]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          sha256=$(sed -n 's/^set(conformance_bitwuzla_release_sha256 \([0-9a-f]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          archive=Bitwuzla-Linux-x86_64-static
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/bitwuzla.zip" \
            "https://github.com/bitwuzla/bitwuzla/releases/download/$release/$archive.zip"
          echo "$sha256  $RUNNER_TEMP/bitwuzla.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bitwuzla.zip" -d "$RUNNER_TEMP/bitwuzla"
          echo "GEMSTONE_BITWUZLA_EXE=$RUNNER_TEMP/bitwuzla/$archive/bin/bitwuzla" >> "$GITHUB_ENV"
      - run: sbt --server --batch 'tests${{ matrix.platform }}/testFull'
      - if: matrix.platform == 'JVM'
        run: sbt --server --batch 'gemstoneRun -- printenv GEMSTONE_RPC_ENDPOINT'

  ctest:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMSTONE_OFFLINE_ON: 1
    steps:
      - *free-disk
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - *toolchain-image-key
      - *toolchain-image
      - *toolchain-image-load
      - *references
      - *download-build
      - *unpack
      - run: |
          status=0
          sbt --server --batch native/test || status=1
          ctest --test-dir target/conformance/host --output-on-failure --parallel "$(nproc)" || status=1
          exit $status

  lint:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - *free-disk
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - uses: actions/cache@v6
        with:
          path: ~/.local/lint-tools
          key: lint-tools-${{ hashFiles('conformance/artifacts/Toolchains.cmake') }}
      - name: Format and lint tools
        timeout-minutes: 20
        # the conformance host build is linted on the runner; native is linted in the toolchain image
        run: |
          tools=~/.local/lint-tools
          tools_release=$(sed -n 's/^set(conformance_clang_tools_release \([0-9.]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          tools_sha256=$(sed -n 's/^set(conformance_clang_tools_release_sha256 \([0-9a-f]*\))$/\1/p' conformance/artifacts/Toolchains.cmake)
          llvm_tools="$tools/llvm-tools-$tools_release"
          if [ ! -x "$llvm_tools/bin/clang-tidy" ]; then
            archive="LLVM-$tools_release-Linux-X64"
            curl -fsSL --retry 5 --speed-limit 102400 --speed-time 60 -o "$RUNNER_TEMP/llvm-tools.tar.xz" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$tools_release/$archive.tar.xz"
            echo "$tools_sha256  $RUNNER_TEMP/llvm-tools.tar.xz" | sha256sum --check --strict
            mkdir -p "$llvm_tools"
            set -- "$archive/lib/clang/${tools_release%%.*}/include"
            for tool in clang-format clang-tidy run-clang-tidy clang-apply-replacements; do
              set -- "$@" "$archive/bin/$tool"
            done
            tar -xJf "$RUNNER_TEMP/llvm-tools.tar.xz" --strip-components=1 -C "$llvm_tools" "$@"
            rm "$RUNNER_TEMP/llvm-tools.tar.xz"
          fi
          mkdir -p "$tools/bin"
          for tool in clang-format clang-tidy run-clang-tidy clang-apply-replacements; do
            ln -sf "$llvm_tools/bin/$tool" "$tools/bin/$tool"
          done
          echo "$tools/bin" >> "$GITHUB_PATH"
      - *toolchain-image-key
      - *toolchain-image
      - *toolchain-image-load
      - *references
      - *dependencies
      - *download-build
      - *unpack
      - run: sbt --server --batch 'lintSources;conformance/codestyleLint'

  # one backend per runner: each route builds the single toolchain image it needs and lints alone, so the images stay
  # small and the routes do not compete for the memory clang-tidy needs
  conformance-lint:
    needs: shards
    name: conformance-lint (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.shards.outputs.lint) }}
    steps:
      - *free-disk
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - *dependencies
      - run: |
          sbt --server --batch 'set conformance / conformanceLintTargets := Seq("lint-${{ matrix.backend }}")' conformance/lintBackends

  semantics:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        isa: [PTX, SASS, SASSHopper, SASSBlackwell, AMDGPU, AMDGPUMatrix, AMDGPUResource, SPIRV]
    env:
      GEMSTONE_OFFLINE_ON: 1
      GEMSTONE_EXECUTION_THREAD_COUNT: 2
    steps:
      - *checkout
      - *java
      - *sbt
      - *download-build
      - *unpack
      - run: sbt --server --batch 'semanticsCheck${{ matrix.isa }}/testOnly *'

  conformance:
    needs: [shards, build, conformance-package-cache, conformance-build, conformance-package]
    if: ${{ !cancelled() }}
    name: conformance (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.run) }}
    env:
      GEMSTONE_OFFLINE_ON: 1
      CONFORMANCE_CASE_SHARD: ${{ matrix.cases }}
    steps:
      - *free-disk
      - *checkout
      - *java
      - *sbt
      - *tools-cache
      - *tools
      - *toolchain-image-key
      - *toolchain-image
      - *toolchain-image-load
      - *references
      - *dependencies
      - if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          pattern: "{build,conformance}"
          path: target/ci
          merge-multiple: true
      - *unpack
      # the server takes half the memory and the clients most of the rest, so sbt, which also compiles the emulator, gets
      # a quarter
      - name: Emulate
        run: |
          while sleep 60; do eval "$MEMORY_SAMPLE"; done &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          heap=$(awk '/^MemTotal:/ { printf "%dm", $2 / 1024 / 4 }' /proc/meminfo)
          sbt --server --batch "-J-Xmx$heap" 'set conformance / conformanceJfr := true' \
            "conformance/emulate --prebuilt --workload $CONFORMANCE_WORKLOAD ${{ matrix.routes }}"
      # the server records one JFR file per run, in a temporary directory; rename it after the shard
      - name: Collect JFR
        if: ${{ !cancelled() && !env.ACT }}
        run: |
          mkdir -p target/conformance/jfr-report
          for recording in target/conformance/jfr/emulate-*/server.jfr; do
            [ -f "$recording" ] || continue
            mv "$recording" "target/conformance/jfr-report/${{ matrix.shard }}-server.jfr"
          done
          ls -l target/conformance/jfr-report
      - if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.shard }}
          path: target/conformance/emulated
      - if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: jfr-${{ matrix.shard }}
          path: target/conformance/jfr-report
          if-no-files-found: ignore
          compression-level: 0

  conformance-summary:
    needs: conformance
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      - run: |
          for report in $(find reports -name junit.xml | sort); do
            echo "- ${report#reports/}: $(grep -om1 'tests="[0-9]*" failures="[0-9]*" skipped="[0-9]*"' "$report")"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ needs.conformance.result != 'success' }}
        run: |
          echo "conformance shards: ${{ needs.conformance.result }}"
          exit 1
