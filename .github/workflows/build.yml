name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GEMSTONE_TEST_PROFILE: default
      GEMSTONE_EXECUTION_PARALLELISM: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CONTAINER_EXECUTABLE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake liblz4-dev libzstd-dev ninja-build python3 spirv-tools
      - name: Lint and tests
        run: sbt --server --batch -J-Xmx3g lint test
